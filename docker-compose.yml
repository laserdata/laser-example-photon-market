services:
  iggy:
    image: ${LASER_IGGY_IMAGE:-docker.io/laserdatainc/iggy-server}
    pull_policy: always
    container_name: photon-iggy
    restart: unless-stopped
    init: true
    environment:
      IGGY_ROOT_USERNAME: ${LASER_IGGY_USERNAME:-iggy}
      IGGY_ROOT_PASSWORD: ${LASER_IGGY_PASSWORD:-laser}
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
      IGGY_NODE_ADVERTISED_ADDRESS: iggy
      IGGY_HTTP_ADDRESS: 0.0.0.0:3000
      IGGY_QUIC_ENABLED: "false"
      IGGY_WEBSOCKET_ENABLED: "false"
      IGGY_PLANE_ENABLED: "true"
      IGGY_PLANE_SOCKET_PATH: /run/laserdata/plane.sock
      IGGY_PLANE_REQUEST_TIMEOUT: 15s
      IGGY_PATH: /var/lib/iggy
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ports:
      - "${LASER_BIND_ADDRESS:-127.0.0.1}:${LASER_IGGY_PORT:-8090}:8090"
      - "${LASER_BIND_ADDRESS:-127.0.0.1}:${LASER_IGGY_HTTP_PORT:-3000}:3000"
    volumes:
      - laser-iggy-data:/var/lib/iggy
      - laser-plane-run:/run/laserdata
    healthcheck:
      test: ["CMD", "/usr/local/bin/iggy-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 30s

  plane:
    image: ${LASER_PLANE_IMAGE:-docker.io/laserdatainc/laser-plane}
    pull_policy: always
    container_name: photon-plane
    restart: unless-stopped
    init: true
    depends_on:
      - iggy
    environment:
      LD_PLANE_IGGY_URL: tcp://iggy:8090
      LD_PLANE_IGGY_HTTP_URL: http://iggy:3000
      LD_PLANE_IGGY_USERNAME: ${LASER_IGGY_USERNAME:-iggy}
      LD_PLANE_IGGY_PASSWORD: ${LASER_IGGY_PASSWORD:-laser}
      LD_PLANE_IGGY_TLS_DISABLED: "true"
      LD_PLANE_QUERY_SOCKET: /run/laserdata/plane.sock
      LD_PLANE_DB_PATH: /var/lib/laser-plane/index.db
      LD_PLANE_HEALTH_ADDR: 127.0.0.1:8089
      LD_PLANE_INTERNAL_API_TOKEN: ${LASER_PLANE_INTERNAL_API_TOKEN:-laser-plane-internal}
    volumes:
      - laser-plane-data:/var/lib/laser-plane
      - laser-plane-run:/run/laserdata
    healthcheck:
      test: ["CMD", "/usr/local/bin/plane-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 30s

volumes:
  laser-iggy-data:
  laser-plane-data:
  laser-plane-run:
